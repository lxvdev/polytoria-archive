name: Archive Polytoria Builds

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "Release channel to archive"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        release: ${{ github.event_name == 'schedule' && fromJson('["stable", "beta"]') || fromJson(format('["{0}"]', github.event.inputs.release)) }}
    env:
      RELEASE: ${{ matrix.release }}
      PT_AUTH: ${{ secrets.PT_AUTH }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run archive script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python archiver.py

      - name: Commit version history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "Update version history" || echo "No changes to commit"
          git push
